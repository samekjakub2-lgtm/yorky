name: DB types

# Vygeneruje src/types/database.ts zo skutočnej databázy (supabase db start +
# gen types) a commitne ho do vetvy, ak sa zmenil. Na main sa necommituje –
# tam CI iba kontroluje, že typy sedia s migráciami (ci.yml).
on:
  push:
    branches-ignore: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-types.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: supabase db start
      - name: Generate types
        run: |
          supabase gen types typescript --local > src/types/database.ts
          # Bez projektového configu (ten načítava tailwind plugin z node_modules); rovnaké pravidlá.
          npx --yes prettier@3 --no-config --single-quote --print-width 100 --trailing-comma all --bracket-same-line --write src/types/database.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo "Typy sú aktuálne."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.ts
          git commit -m 'chore(types): regenerate database types'
          git push
